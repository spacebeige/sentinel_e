; AWAAZ Asterisk Dialplan
; Add to FreePBX extensions_custom.conf

[from-awaaz]
exten => s,1,NoOp(AWAAZ - Multilingual Grievance Assistant)
; DON'T call AudioSocket() here — the engine originates it via ARI
 same => n,Answer()
 same => n,Stasis(awaaz)
 same => n,Hangup()

; Optional: Route inbound tollfree to AWAAZ
[from-pstn]
exten => _1800XXXXXXX,1,NoOp(AWAAZ Inbound)
 same => n,Goto(from-awaaz,s,1)

; Optional: Callback queue for missed calls
[missed-call-callback]
exten => s,1,NoOp(AWAAZ Callback)
 same => n,Set(CALLERID(num)=1800123456)
 same => n,Stasis(awaaz)
 same => n,Hangup()

; Context for live agent transfer (when requested)
[transfer-agents]
exten => 101,1,NoOp(Transfer to Agent 101)
 same => n,Queue(support_queue)
 same => n,Hangup()

exten => 102,1,NoOp(Transfer to Agent 102)
 same => n,Queue(support_queue)
 same => n,Hangup()
