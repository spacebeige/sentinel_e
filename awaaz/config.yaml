# AWAAZ Configuration - Single source of truth

asterisk:
  host: "${ASTERISK_HOST:127.0.0.1}"
  ari_port: "${ASTERISK_ARI_PORT:8088}"
  ari_username: "${ASTERISK_ARI_USERNAME:asterisk}"
  ari_password: "${ASTERISK_ARI_PASSWORD:asterisk}"
  stasis_app: "awaaz"

audiosocket:
  host: "0.0.0.0"
  port: 8090
  format: "slin"  # slin = PCM16 16kHz (best quality, lowest latency)

playback:
  media_dir: "/tmp/awaaz_media"
  format: "ulaw"  # always write μ-law for Asterisk playback

vad:
  engine: "webrtc"
  aggressiveness: 2  # 0-3, 2 recommended for telephony
  silence_ms: 700
  max_utterance_s: 30

stt:
  model: "small"  # tiny/base/small/medium
  device: "auto"  # auto=GPU if available, else CPU
  concurrency: 5

llm:
  primary:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    api_key: "${GROQ_API_KEY:}"
    max_tokens: 150
    temperature: 0.4
  fallback:
    provider: "ollama"
    model: "llama3.2:3b"
    url: "http://localhost:11434/api/generate"

tts:
  primary:
    engine: "coqui"
    langs: ["hi", "mr", "en"]
  fallback:
    engine: "gtts"
    langs: ["ta", "te", "bn", "gu", "kn", "ml", "pa", "or", "as", "ur"]

lang_detect:
  fasttext_model: "${FASTTEXT_MODEL_PATH:/tmp/lid.176.bin}"
  mixed_threshold: 0.20

metrics:
  enabled: true
  port: 15000
  path: "/metrics"

database:
  path: "awaaz.db"

sms:
  provider: "fast2sms"
  api_key: "${FAST2SMS_API_KEY:}"
