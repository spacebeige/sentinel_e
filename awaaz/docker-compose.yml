version: "3.9"

services:
  awaaz_engine:
    build: .
    container_name: awaaz_engine
    restart: unless-stopped
    ports:
      - "8090:8090"      # AudioSocket TCP
      - "15000:15000"    # Prometheus metrics + health
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./awaaz.db:/app/awaaz.db
      - asterisk_media:/mnt/asterisk_media
      - fasttext_models:/tmp
    environment:
      - ASTERISK_HOST=${ASTERISK_HOST:127.0.0.1}
      - ASTERISK_ARI_PORT=${ASTERISK_ARI_PORT:8088}
      - ASTERISK_ARI_USERNAME=${ASTERISK_ARI_USERNAME:asterisk}
      - ASTERISK_ARI_PASSWORD=${ASTERISK_ARI_PASSWORD:asterisk}
      - GROQ_API_KEY=${GROQ_API_KEY:}
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY:}
      - FASTTEXT_MODEL_PATH=/tmp/lid.176.bin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  asterisk_media:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  fasttext_models:
